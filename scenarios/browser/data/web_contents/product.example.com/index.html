<!DOCTYPE html>
<html>
<head>
    <title>Example Product</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .product { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .product img { max-width: 200px; float: left; margin-right: 20px; }
        .product-info { overflow: hidden; }
        .price { font-size: 24px; color: #e74c3c; font-weight: bold; }
        .btn { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Example Products</h1>
        
        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Product 1">
            <div class="product-info">
                <h2>Web Browser Pro</h2>
                <p>Advanced web browsing solution with security features.</p>
                <div class="price">$99.99</div>
                <button class="btn">Add to Cart</button>
            </div>
        </div>
        
        <div class="product">
            <img src="https://via.placeholder.com/200" alt="Product 2">
            <div class="product-info">
                <h2>API Testing Tool</h2>
                <p>Comprehensive API testing and debugging platform.</p>
                <div class="price">$149.99</div>
                <button class="btn">Add to Cart</button>
            </div>
        </div>
    </div>
</body>
</html>
